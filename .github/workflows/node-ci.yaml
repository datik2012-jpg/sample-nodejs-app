name: CI Node.js pipeline run tests

on:
  push:
    branches: [main, feature/add-ci]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application and run tests
        shell: bash
        env:
          PORT: '8080'
          TEST_BASE_URL: http://127.0.0.1:8080
        run: |
          set -euo pipefail

          node app.js > app.log 2>&1 &
          APP_PID=$!

          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=false

          for attempt in {1..30}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "Application exited before becoming ready"
              exit 1
            fi

            if curl --fail --silent --max-time 2 \
              "$TEST_BASE_URL/ready" > /dev/null; then
              ready=true
              break
            fi

            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "Application did not become ready"
            exit 1
          fi

      - name: Run automated tests
        run: npm test


      - name: Show application logs
        if: always()
        run: cat app.log 2>/dev/null || true