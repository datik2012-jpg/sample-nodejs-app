name: CI Node.js pipeline run tests and build image

on:
  push:
    branches:
      - 'feature'
      - 'feature/**'

  pull_request:
    branches:
      - develop
      - main      

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application
        shell: bash
        env:
          PORT: '8080'
        run: |
          node app.js > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        shell: bash
        run: |
          for attempt in {1..30}; do
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              echo "Application stopped during startup"
              exit 1
            fi

            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:8080/ready > /dev/null; then
              echo "Application is ready"
              exit 0
            fi

            sleep 1
          done

          echo "Application did not become ready"
          exit 1

      - name: Run automated tests
        env:
          TEST_BASE_URL: http://127.0.0.1:8080
        run: npm test

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi

      - name: Show application logs
        if: always()
        run: cat app.log 2>/dev/null || true

  docker-build:
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Build Docker image
        run: docker build -t node-api-feature:${{ github.sha }} . 
