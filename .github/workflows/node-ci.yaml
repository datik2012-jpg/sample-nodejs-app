name: CI Node.js pipeline run tests and build image

on:
  push:
    branches:
      - 'feature'
      - 'feature/**'
      - 'develop'

  pull_request:
    branches:
      - develop
      - main      

permissions:
  contents: read

jobs:

  detect-changes:  # Skip ECR publishing when only values-staging.yaml changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.changes.outputs.publish }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether to publish an image
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          publish=true

          if [[ "$EVENT_NAME" == "push" &&
                -n "$BEFORE_SHA" &&                  #not empty - can be when first time new branch
                ! "$BEFORE_SHA" =~ ^0+$ ]]; then     #not 0000000000 when first time new branch
            changed_files=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")

            if [[ "$changed_files" == "helm/sample-nodejs-app/values-staging.yaml" ]]; then
              publish=false
            fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start application
        shell: bash
        env:
          PORT: '8080'
        run: |
          node app.js > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for application
        shell: bash
        run: |
          for attempt in {1..30}; do
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              echo "Application stopped during startup"
              exit 1
            fi

            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:8080/ready > /dev/null; then
              echo "Application is ready"
              exit 0
            fi

            sleep 1
          done

          echo "Application did not become ready"
          exit 1

      - name: Run automated tests
        env:
          TEST_BASE_URL: http://127.0.0.1:8080
        run: npm test

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi

      - name: Show application logs
        if: always()
        run: cat app.log 2>/dev/null || true


  sast:
    name: Snyk SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Scan source code
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high   
        
  docker-build:
    needs: [build-and-test, sast, detect-changes]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    
    # apply to aws aim OIDC and get the token for aws authorization
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Build Docker image
        run: docker build -t node-api-feature:${{ github.sha }} . 
        

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: node-api-feature:${{ github.sha }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false 
      
      - name: Show OIDC identity   # added this part to troubleshoot aws access fail
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.detect-changes.outputs.publish == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`sub: ${claims.sub}`);
            core.info(`aud: ${claims.aud}`);

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.detect-changes.outputs.publish == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::438465166774:role/github-actions-ecr-push
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.detect-changes.outputs.publish == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.detect-changes.outputs.publish == 'true'
        env:
          ECR_REPOSITORY: 438465166774.dkr.ecr.eu-central-1.amazonaws.com/sample-nodejs-app-ecr-registry
        run: |
          docker tag node-api-feature:${{ github.sha }} "$ECR_REPOSITORY:develop-${{ github.sha }}"
          docker push "$ECR_REPOSITORY:develop-${{ github.sha }}" 

  
  update-staging-image:
    needs: [docker-build, detect-changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && needs.detect-changes.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: develop

      - name: Update staging image tag
        env:
          IMAGE_TAG: develop-${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("helm/sample-nodejs-app/values-staging.yaml")
          content = path.read_text()

          updated, count = re.subn(
              r'^  tag:.*$',
              f'  tag: "{os.environ["IMAGE_TAG"]}"',
              content,
              flags=re.MULTILINE,
          )

          if count != 1:
              raise SystemExit("Expected exactly one image tag")

          path.write_text(updated)
          PY
      
          

      - name: Check that develop still matches the built image 
        env:
          BUILT_SHA: ${{ github.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$BUILT_SHA" ]]; then
            echo "Develop has newer commits. Use the newer workflow run."
            exit 1
          fi    

      - name: Create staging image pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: develop
          branch: automation/staging-image-${{ github.sha }}
          add-paths: helm/sample-nodejs-app/values-staging.yaml
          commit-message: "Update staging image to develop-${{ github.sha }}"
          title: "Update staging image to develop-${{ github.sha }}"
          body: |
            Update the staging image to the image published by this workflow.
            Image tag: develop-${{ github.sha }}        