name: Build Docker image

on:
  workflow_run:
    workflows: ["CI Node.js pipeline run tests"]
    types: [completed]

permissions:
  contents: read

jobs:
  docker-build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout CI run head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t node-api-feature:${{ github.event.workflow_run.head_sha }} .