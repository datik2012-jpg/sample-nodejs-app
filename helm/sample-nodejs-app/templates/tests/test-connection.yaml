apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "sample-nodejs-app.fullname" . }}-test-connection"
  labels:
    {{- include "sample-nodejs-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['http://{{ include "sample-nodejs-app.fullname" . }}:{{ .Values.service.port }}/ready']
  restartPolicy: Never
